[project]
name = "ContextDock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "habib-rehman-dev", email = "contact.habib.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=0.0.27",
    "langchain-groq>=1.1.3",
    "nest-asyncio>=1.6.0",
    "langgraph>=1.2.16",
    "langchain-core>=1.6.11",
    "gitingest>=0.3.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langchain-huggingface>=1.2.3",
    "sentence-transformers>=6.2.0",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "ipywidgets>=8.1.9",
]

[project.scripts]
6-ngrok = "6_ngrok:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "ngrok",
]
